name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'build.bat') }}
          restore-keys: |
            nuitka-${{ runner.os }}-py312-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "nuitka[onefile]"
          # 本项目不需要 numpy；避免残缺 numpy 被打进 exe 后触发 openpyxl 的 numpy.short 错误
          pip uninstall -y numpy 2>$null
          python -c "import importlib.util; assert importlib.util.find_spec('numpy') is None, 'numpy still installed'"

      - name: Build with Nuitka
        shell: cmd
        run: |
          call build.bat

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path ".\invoice.exe")) {
            Write-Host "invoice.exe not found in repo root."
            Get-ChildItem -Path . -Recurse -Filter *.exe | Select-Object FullName
            throw "Build output invoice.exe not found."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoice-windows-exe
          path: invoice.exe
          if-no-files-found: error
