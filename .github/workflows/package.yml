name: Build Invoice EXE

on:
  push:
    tags:
      - 'v*' # 当你推送到 v1.0 等标签时触发
  workflow_dispatch: # 允许你手动在 GitHub 页面点击运行

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 换成你用的 Python 版本

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Build EXE with Nuitka
        run: |
          python -m nuitka --standalone --onefile --mingw64 `
          --lto=yes `
          --windows-icon-from-ico=invoice_logo.ico `
          --company-name="Todd Dev Studio" `
          --product-name="InvoiceParser" `
          --file-version=${{ github.ref_name }} `
          --file-description="用于处理发票数据的自动化工具" `
          --copyright="Copyright © 2025 Todd Dev Studio. All rights reserved." `
          --output-filename=invoice `
          .\src\invoice\main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Invoice-Executable
          path: invoice.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: invoice.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}